version: "3.9"

# Anamnys AI — Dev Docker Compose
# Starts: API + PostgreSQL + Redis (for future caching) + Python sidecar stub
# AI models are loaded from ./models/ on the host (bind mount).
#
# Usage:
#   docker compose up --build
#   API:  http://localhost:5000
#   Swagger: http://localhost:5000/swagger
#   Hangfire: http://localhost:5000/jobs

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: clinicaldraft_dev
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # ── .NET API ──────────────────────────────────────────────────────────────────
  # api:
  #   build:
  #     context: .
  #     dockerfile: src/Anamnys.Api/Dockerfile
  #   ports:
  #     - "5000:8080"
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Development
  #     ConnectionStrings__Default: "Host=postgres;Port=5432;Database=clinical_draft_dev;Username=postgres;Password=postgres"
  #     Jwt__Key: "dev-secret-key-change-before-any-real-use-32chars!"
  #     Whisper__ModelPath: /app/models/ggml-medium.bin
  #     Llama__ModelPath: /app/models/mistral-7b-q4_k_m.gguf
  #     Storage__BucketName: clinical-draft-audio
  #     Storage__ServiceUrl: http://minio:9000
  #     Storage__AccessKey: minioadmin
  #     Storage__SecretKey: minioadmin
  #     Storage__Region: us-east-1
  #   volumes:
  #     - ./models:/app/models:ro # mount model files from host
  #     - audio_temp:/app/temp # temp audio during processing
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # ── Python sidecar (Phase 2: diarization + emotion) ─────────────────────────
  # Uncomment when ready for Phase 2
  # python-sidecar:
  #   build:
  #     context: ./python-sidecar
  #   ports:
  #     - "8001:8001"
  #   volumes:
  #     - ./models:/app/models:ro

  # ── MinIO (S3-compatible local storage) ──────────────────────────────────────
  minio:
    image: minio/minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console (http://localhost:9001, user: minioadmin / minioadmin)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket init (creates the bucket on first run) ───────────────────────
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/clinical-draft-audio;
      exit 0
      "

volumes:
  postgres_data:
  audio_temp:
  minio_data:
